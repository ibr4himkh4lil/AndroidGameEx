name: Ultimate Android CI/CD Pipeline

on:
  push: # যেকোনো ব্রাঞ্চ বা ট্যাগে পুশ করলেই অটোমেটিক ট্রিগার হবে
  pull_request: # যেকোনো ব্রাঞ্চে Pull Request করলে ট্রিগার হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

permissions:
  contents: write # Auto GitHub Release তৈরি করার জন্য পারমিশন

jobs:
  build-and-release:
    name: Build & Auto Release
    runs-on: ubuntu-latest

    steps:
    # ১. কোড চেকআউট
    - name: Checkout Code
      uses: actions/checkout@v4

    # ২. JDK 17 সেটআপ ও Gradle Cache
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # ৩. gradlew পারমিশন প্রদান
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # ৪. Lint & Code Quality Check (আউটপুট build_log.txt ফাইলে সেভ হবে)
    - name: Run Lint Check
      run: ./gradlew lintDebug 2>&1 | tee build_log.txt

    # ৫. Debug এবং Release উভয় APK একসাথে বিল্ড (লগ ফাইলের শেষে যুক্ত হবে)
    - name: Build Debug & Release APKs
      run: ./gradlew assembleDebug assembleRelease 2>&1 | tee -a build_log.txt

    # ৬. সম্পূর্ণ বিল্ড লগ Artifacts-এ সেভ রাখা (বিল্ড ফেল করলেও এটি ডাউনলোড করা যাবে)
    - name: Upload Build Logs Artifact
      if: always() # বিল্ড পাস বা ফেল যাই হোক না কেন লগ সেভ হবে
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-TXT
        path: build_log.txt
        retention-days: 7

    # ৭. Debug APK সেভ রাখা (Artifacts)
    - name: Upload Debug APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    # ৮. Release APK সেভ রাখা (Artifacts)
    - name: Upload Release APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30

    # ৯. Auto GitHub Release (Tag পুশ করলে রিলিজ পেজে অটোমেটিক APK আপলোড হবে)
    - name: Create Auto GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release-unsigned.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
